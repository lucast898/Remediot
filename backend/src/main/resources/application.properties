spring.application.name=RemedIoT
server.port=8080

# Banco de dados (ver README.md para subir via Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/remediot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:remediot}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (NUNCA versione um segredo real — sobrescreva via variável de ambiente em produção)
remediot.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
remediot.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS do frontend em dev
remediot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Verificação periódica de doses não retiradas (ms)
remediot.scheduler.check-interval-ms=${SCHEDULER_INTERVAL_MS:300000}

# Chave do dispositivo (gancho futuro: Node-RED chamando /api/devices/events)
remediot.device.api-key=${DEVICE_API_KEY:dev-only-device-key-change-me}

# Dados de exemplo — cria 1 cuidador + 4 pacientes só se o banco estiver vazio
remediot.seed.enabled=${SEED_ENABLED:true}
