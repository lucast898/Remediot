spring.datasource.url=jdbc:h2:mem:remediot-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
remediot.jwt.secret=test-only-secret-test-only-secret-test-only-secret
remediot.jwt.expiration-ms=3600000
remediot.cors.allowed-origins=http://localhost:5173
remediot.scheduler.check-interval-ms=300000
remediot.device.api-key=test-only-device-key
remediot.seed.enabled=false
